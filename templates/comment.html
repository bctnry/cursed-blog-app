<div id="c-{{ID}}" class="comment">
  <div class="comment-id"><a href="#c-{{ID}}">{{ID}}</a></div>
  <div class="comment-name">{{Name}} <span class="comment-datetime">@ {{Datetime}}</span> {{ShowEditLink}}</div>
  <div class="comment-email">Email: <a href="mailto:{{Email}}">{{Email}}</a></div>
  <div class="comment-website">Website: <a href="{{Website}}">{{Website}}</a></div>
  <p class="comment-content">{{Content}}</p>
</div>
